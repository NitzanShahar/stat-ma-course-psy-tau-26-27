<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>סטטיסטיקה ושיטות מחקר</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f1d2b;--soft:#6b6878;--accent:#5b3fa8;--bg:#fbfaf7}
*{box-sizing:border-box;margin:0}
body{font-family:Rubik,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:grid;place-items:center;padding:24px 16px}
main{max-width:560px;text-align:center}
h1{font-weight:500;font-size:clamp(28px,6vw,40px);line-height:1.2}
.sub{margin-top:12px;color:var(--soft);font-size:17px}
.rule{width:48px;height:3px;background:var(--accent);border-radius:2px;margin:28px auto}
.note{font-size:17px;line-height:1.7}
</style>
</head>
<body>
<main>
  <h1>סטטיסטיקה ושיטות מחקר</h1>
  <p class="sub">פרופ' ניצן שחר · תשפ״ז · בית הספר למדעי הפסיכולוגיה, אוניברסיטת תל אביב</p>
  <div class="rule"></div>
  <p class="note">האתר בהכנה. חומרי הקורס יופיעו כאן לקראת תחילת הסמסטר.</p>
</main>
</body>
</html>
