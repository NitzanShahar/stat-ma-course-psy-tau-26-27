<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>שליפה משק גאוסיאני</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap">
<style>
/* יחידה א׳ (כחול) כצבע הדגשה יחיד, כמו W5_K1 */
:root { --bg: #fcfcfa; --ink: #1b2028; --ink-soft: #5a6472; --ink-faint: #c9ced5;
  --unit: #185fa5; --unit-line: #9fbbd9; --unit-bg: #eaf1f9; --btn-text: #ffffff; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #15181d; --ink: #e9ecf0; --ink-soft: #9aa3ae; --ink-faint: #3a414b;
    --unit: #7fb0e3; --unit-line: #3d5f82; --unit-bg: #1d2a38; --btn-text: #0f1722; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #15181d; --ink: #e9ecf0; --ink-soft: #9aa3ae; --ink-faint: #3a414b;
  --unit: #7fb0e3; --unit-line: #3d5f82; --unit-bg: #1d2a38; --btn-text: #0f1722; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Assistant", "Arial Hebrew", Arial, sans-serif;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 22px; padding-block: 28px; text-align: center; max-width: 560px; margin: 0 auto; }
h1 { margin: 0; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 700; }
.sub { margin: -10px 0 0; color: var(--ink-soft); font-size: 1.2rem; }
.title-rule { width: 90px; height: 4px; border-radius: 2px; background: var(--unit); margin: -8px 0 0; }
.sack { width: 150px; height: auto; }
.sack path, .sack circle { stroke: var(--ink-soft); }
button { font: inherit; font-size: 1.6rem; font-weight: 700; background: var(--unit); color: var(--btn-text); border: 0;
  border-radius: 16px; padding: 14px 40px; min-width: min(300px, 100%); cursor: pointer; }
button.ghost { background: transparent; color: var(--ink-soft); font-size: 1.1rem; font-weight: 600; padding: 8px 20px; min-width: 0;
  border: 2px solid var(--ink-faint); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--unit-line); outline-offset: 3px; }
button:disabled { opacity: .5; cursor: default; }
[hidden] { display: none !important; }
.pick { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.pick label { font-size: 1.3rem; font-weight: 600; }
.pick input { font: inherit; font-size: 2rem; width: 140px; text-align: center; padding: 6px; border-radius: 12px;
  border: 2px solid var(--unit-line); background: transparent; color: var(--ink); }
.err { color: var(--ink-soft); min-height: 1.3em; margin: 0; }
.bagno { margin: 0; font-size: 1.3rem; color: var(--ink-soft); }
.balls { display: flex; gap: 14px; justify-content: center; margin: 0; padding: 0; list-style: none; }
.balls li { width: 68px; height: 68px; border-radius: 50%; border: 3px dashed var(--ink-faint);
  display: grid; place-items: center; font-size: 1.7rem; font-weight: 700; direction: ltr; }
.balls li.on { border: 3px solid var(--unit); background: var(--unit-bg); animation: pop .45s ease-out; }
@keyframes pop { 0% { transform: translateY(-40px) scale(.6); opacity: 0; } 70% { transform: translateY(4px) scale(1.05); opacity: 1; } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .balls li.on { animation: none; } }
.note { margin: 0; color: var(--ink-soft); font-size: 1.1rem; line-height: 1.5; }
.reveal { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.reveal .what { margin: 0; font-size: 1.8rem; font-weight: 700; color: var(--unit); direction: rtl; }
.reveal { width: 100%; }
#pic { width: 100%; max-width: 440px; }
#pic svg { width: 100%; height: auto; display: block; }
#pic svg polyline.on { stroke: var(--unit); stroke-width: 3.5; }
#pic svg polyline.off { stroke: var(--ink-faint); stroke-width: 1.5; stroke-dasharray: 5 4; }
#pic svg line { stroke: var(--ink-soft); }
#pic svg text { fill: var(--ink-soft); font-size: 13px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>
<main>
  <h1>שליפה משק גאוסיאני</h1>
  <p class="sub">איזה פיזור?</p>
  <div class="title-rule" aria-hidden="true"></div>
  <svg class="sack" viewBox="0 0 200 170" aria-hidden="true">
    <g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M70 40 C 60 28 80 18 100 26 C 120 18 140 28 130 40"/>
      <path d="M72 44 C 30 70 22 150 100 156 C 178 150 170 70 128 44 Z"/>
      <circle cx="82" cy="110" r="9"/><circle cx="108" cy="96" r="9"/><circle cx="120" cy="124" r="9"/>
    </g>
  </svg>

  <section class="pick" id="pick">
    <label for="no">מספר השק שקיבלתם</label>
    <input id="no" type="number" inputmode="numeric" min="1" max="30" autocomplete="off">
    <button id="open" type="button">פתיחת השק</button>
    <p class="err" id="err" aria-live="polite"></p>
  </section>

  <section id="game" hidden>
    <div style="display:flex;flex-direction:column;align-items:center;gap:20px">
      <p class="bagno" id="bagno"></p>
      <ol class="balls" id="balls"><li></li><li></li><li></li><li></li></ol>
      <button id="draw" type="button">שליפת כדור</button>
      <p class="note" id="note" aria-live="polite">כל כדור מוחזר לשק לפני השליפה הבאה.</p>
      <button id="show" class="ghost" type="button" hidden>חשיפת השק</button>
      <div class="reveal" id="reveal" hidden><p class="what" id="what"></p><div id="pic"></div></div>
      <div class="row"><button id="again" class="ghost" type="button">שק אחר</button></div>
    </div>
  </section>
</main>

const $ = id => document.getElementById(id);
let cur = null, n = 0;
function open() {
  const k = +$('no').value;
  if (!BAGS[k]) { $('err').textContent = 'אין שק כזה. המספרים הם 1 עד 30.'; return; }
  cur = k; n = 0; $('err').textContent = '';
  $('pick').hidden = true; $('game').hidden = false;
  $('bagno').textContent = 'שק מס׳ ' + k;
  [...$('balls').children].forEach(li => { li.className = ''; li.textContent = ''; });
  $('draw').hidden = false; $('show').hidden = true; $('reveal').hidden = true;
  $('note').textContent = 'כל כדור מוחזר לשק לפני השליפה הבאה.';
}
$('open').onclick = open;
$('no').addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
$('draw').onclick = () => {
  const li = $('balls').children[n];
  li.textContent = BAGS[cur].obs[n]; li.className = 'on'; n++;
  if (n === 4) {
    $('draw').hidden = true; $('show').hidden = false;
    $('note').textContent = 'רשמו את ארבעת המספרים בדף העבודה, חשבו והמרו. רק אחר כך חושפים את השק.';
  }
};
$('show').onclick = () => {
  if (!confirm('כבר חישבתם והימרתם? אחרי החשיפה אי אפשר להמר.')) return;
  const t = BAGS[cur].type;
  $('what').innerHTML = 'שק מס׳ ' + cur + ': <bdi dir="ltr" style="white-space:nowrap">' + TYPES[t] + '</bdi>';
  $('pic').innerHTML = PICS[t];
  $('reveal').hidden = false; $('show').hidden = true;
};
$('again').onclick = () => { $('game').hidden = true; $('pick').hidden = false; $('no').value = ''; $('no').focus(); };
</script>
